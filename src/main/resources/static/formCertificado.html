<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mãos à Obra</title>

    <link rel="stylesheet" href="/css/styleformcertificado.css?v=3">
    <link rel="stylesheet" href="/css/geral.css">

    <link rel="icon" type="/image/png" href="/images/Logo_TCC.png">
</head>
<body>
<aside class="sidebar-esquerda">

    <button class="btn-voltar" onclick="history.back()">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>
<div class="pagina">
    <header class="header">
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="logo">
        </div>
    </header>
    <main class="conteudo">
        <form class="form-certificado" id="cadastroForm" method="post">
            <div class="texto">
                <h1>Cadastrar certificado</h1>
            </div>

            <div class="cadastro-certificado">

                <div class="nome">
                    <span>Nome:</span>
                    <input type="text" id="nome" name="Nome" placeholder="Digite seu nome" required>
                </div>

                <div class="certificado">
                    <span>Foto:</span>
                    <input type="file" id="certificado" name="Certificado" accept="image/png, image/jpeg,image/pdf" required>
                </div>

                <button class="btn-enviar">
                    Cadastrar certificado
                </button>
            </div>
        </form>
    </main>
</div>


<aside class="sidebar-direita">

</aside>

</body>
</html>
