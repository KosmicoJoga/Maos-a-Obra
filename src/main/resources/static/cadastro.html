<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mãos à Obra</title>

    <link rel="stylesheet" href="css/stylecadastro.css?v=3">
    <link rel="stylesheet" href="css/geral.css">

    <link rel="icon" type="image/png" href="images/Logo_TCC.png">
</head>
<body>
<aside class="sidebar-esquerda">

    <button class="btn-voltar" onclick="history.back()">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>
<div class="pagina">
    <header class="header">
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="logo">
        </div>
    </header>
    <main class="conteudo">
        <form class="form-cadastrar" id="cadastroForm" method="post">
            <div class="texto">
                <h1> Cadastrar conta</h1>
            </div>

            <br> <br> <br>

            <div class="cadastro">

                <div class="tipoDaConta">
                    <span> Tipo de conta:</span>
                    <label>
                        <input type="radio" name="tipoConta" value="cliente" onclick="MostrarTipo(false)">
                        Cliente
                    </label>
                    <label>
                        <input type="radio" name="tipoConta" value="prestador" onclick="MostrarTipo(true)">
                        Prestador
                    </label>
                </div>

                <div class="nome">
                    <span>Nome:</span>
                    <input type="text" id="nome" name="Nome" placeholder="Digite seu nome" required>
                </div>

                <div class="idade">
                    <span>Idade:</span>
                    <input type="number" id="idade" name="Idade" placeholder="Digite sua idade" required>
                </div>

                <div class="email">
                    <span>Email:</span>
                    <input type="email" id="email" name="Email" placeholder="Digite seu email" required>
                </div>

                <div class="ConfirmaEmail">
                    <span>Confirmar Email:</span>
                    <input type="email" id="confirmaremail" name="ConfirmarEmail" placeholder="Digite seu email novamente" required>
                </div>

                <div class="tipoPrestador" id="tipoPrestador" style="display: none;">
                    <span>Tipo de prestador:</span>
                    <select id="tipo" name="tipo">
                        <option value="eletricista">Eletricista</option>
                        <option value="faxineiro">Faxineiro</option>
                        <option value="encanador">Encanador</option>
                    </select>
                </div>

                <div class="senha">
                    <span>Senha:</span>
                    <input type="password" id="senha" name="Senha" placeholder="Digite sua senha" required>
                </div>

                <div class="jatemconta">
                    <h5 id="texto-conta">Já têm uma conta?</h5>
                    <h5 id="link-entrar"><a href="login.html">Entre aqui</a></h5>
                </div>

                <button type="submit" class="btn-enviar">
                    CADASTRAR
                </button>
            </div>
        </form>
    </main>
</div>

<script>
    function MostrarTipo(mostrar) {
        const campo = document.getElementById("tipoPrestador");

        if (mostrar) {
            campo.style.display = "block";

        } else {
            campo.style.display = "none";

            if (campo.nextElementSibling.tagName === "BR") {
                campo.nextElementSibling.remove();
            }
        }
    }
</script>

<script>
    const form = document.getElementById("cadastroForm");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const tipoConta = document.querySelector(
            'input[name="tipoConta"]:checked'
        );

        const nome = document.getElementById("nome").value;
        const idade = document.getElementById("idade").value;
        const email = document.getElementById("email").value;
        const confirmarEmail = document.getElementById("confirmaremail").value;
        const senha = document.getElementById("senha").value;

        if (!tipoConta) {
            alert("Selecione o tipo de conta!");
            return;
        }

        if (email !== confirmarEmail) {
            alert("Os emails não são iguais!");
            return;
        }

        const dados = {
            nome: nome,
            idade: idade,
            email: email,
            senha: senha,
        };

        let url;

        if (tipoConta.value === "cliente") {
            url = "http://localhost:8080/clientes";
        } else {
            url = "http://localhost:8080/trabalhadores";

            dados.tipo = document.getElementById("tipo").value;
        }

        try {

            const resposta = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                alert("Cadastro realizado com sucesso!");

                window.location.href = "login.html";
            } else {
                alert("Erro ao realizar cadastro!");
            }

        } catch (erro) {
            console.error(erro);
            alert("Não foi possível conectar ao servidor!");
        }

    });
</script>

<aside class="sidebar-direita">

</aside>

</body>
</html>
