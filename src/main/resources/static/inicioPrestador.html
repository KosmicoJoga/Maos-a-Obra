<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos à obra</title>
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/styleinicioPrestador.css">
    <link rel="icon" type="image/png" href="images/Logo_TCC.png">
</head>
<body>


<!-- BARRA LATERAL ESQUERDA-->
<aside class="sidebar-esquerda">

    <button class="btn-voltar">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>


<!-- ÁREA PRINCIPAL -->
<div class="pagina">

    <!-- CABEÇALHO -->
    <header class="header">

        <!-- LOGO -->
        <div class="logo">
            <img src="images/Logo_titulo_horizontal.png" alt="Mãos à Obra">
        </div>


        <!-- AÇÕES DO USUÁRIO -->
        <div class="acoes">


            <a class="notificações">
                <img src="/images/notificacoes.png">
            </a>
            <a class="mensagens">
                <img src="/images/mensagens.png">
            </a>
            <a  class="usuario">
                <img src="/images/foto_perfil.png">
                Nome
            </a>
            <button onclick="logout()">Sair (teste)</button>
        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">


        <!-- PESQUISA -->
        <section class="pesquisa">

            <button class="btn-filtro">
                <img src="/images/filtro.png" alt="Filtros">
            </button>

            <input
                    type="text"
                    placeholder="Pesquise aqui..."
                    class="campo-pesquisa"
            >

            <button class="btn-pesquisar">
                <img src="/images/lupa.png" alt="Pesquisar">
            </button>

        </section>
        <br>
        <a href="/demanda.html" class="btn-demanda">
            Ver solicitações de clientes
        </a>
        <br>
        <div class="linha">

            <span>Demandas publicadas</span>

        </div>
        <br>
        <!-- LISTA DE TRABALHADORES -->
        <section class="lista-trabalhadores">

            <!-- CARD DO TRABALHADOR -->
            <article class="card-trabalhador">

                <!-- FOTO -->
                <div class="foto-trabalhador">
                    <img
                            src="/images/default-user.png"
                            alt="Foto do trabalhador"
                    >
                </div>


                <!-- INFORMAÇÕES -->
                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2>*Pedido*</h2>

                        <p>*Nome* *Idade*</p>
                    </div>


                    <!-- AVALIAÇÃO -->
                    <div class="avaliacao">
                        <span>4,7</span>
                        <span class="estrela">★</span>
                    </div>


                    <!-- BOTÃO -->
                    <a href="/perfil" class="btn-perfil">
                        VER PERFIL
                    </a>

                </div>

            </article>


            <!-- OUTRO CARD -->
            <article class="card-trabalhador">

                <div class="foto-trabalhador">
                    <img
                            src="/images/default-user.png"
                            alt="Foto do trabalhador"
                    >
                </div>

                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2>*Nome* *Idade*</h2>
                        <p>*Tipo de serviço*</p>
                    </div>

                    <div class="avaliacao">
                        <span>4,7</span>
                        <span class="estrela">★</span>
                    </div>

                    <a href="/perfil" class="btn-perfil">
                        VER PERFIL
                    </a>

                </div>

            </article>


            <!-- OUTRO CARD -->
            <article class="card-trabalhador">

                <div class="foto-trabalhador">
                    <img
                            src="/images/default-user.png"
                            alt="Foto do trabalhador"
                    >
                </div>

                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2>*Nome* *Idade*</h2>
                        <p>*Tipo de serviço*</p>
                    </div>

                    <div class="avaliacao">
                        <span>4,7</span>
                        <span class="estrela">★</span>
                    </div>

                    <a href="/perfil" class="btn-perfil">
                        VER PERFIL
                    </a>

                </div>

            </article>

        </section>

    </main>

</div>

<script>
    async function logout() {
        const resposta = await fetch("/login/logout", { method: "POST" });

        if (resposta.ok) {
            window.location.href = "login.html";
        } else {
            alert("Erro ao encerrar a sessão");
        }
    }
</script>

<!-- BARRA LATERAL DIREITA -->
<aside class="sidebar-direita">

</aside>
</body>

</html>
