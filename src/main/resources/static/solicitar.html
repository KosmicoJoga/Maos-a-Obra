<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos à obra</title>
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/styleSolicitar.css">
    <link rel="icon" type="image/png" href="images/Logo_TCC.png">
</head>
<body>
<aside class="sidebar-esquerda">

    <button class="btn-voltar" onclick="history.back()">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>
<div class="pagina">
    <header class="header">
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="logo">
        </div>
    </header>
    <main class="conteudo">
        <div class="texto">
            <h1>Solicitar serviço</h1>
        </div>

        <div class="demanda">
            <div class="local">
                <label for="local">Local:</label>
                <input type="text" id="local" name="Local">
            </div>
            <div class="descricao">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" name="Descricao">
            </div>
            <div class="orcamento">
                <label for="orcamento">Orçamento:</label>
                <input type="text" id="orcamento" name="Orcamento">
            </div>
            <button class="btn-solicita" onclick="history.back()">
                Solicitar serviço
            </button>
        </div>
    </main>
</div>
<aside class="sidebar-direita">

</aside>
</body>
</html>
