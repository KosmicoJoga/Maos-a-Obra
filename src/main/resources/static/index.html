<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mãos à Obra</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/geral.css">

    <link rel="icon" type="image/png" href="images/logo_TCC.png">
</head>

<body>

<!-- BARRA LATERAL ESQUERDA-->
<aside class="sidebar-esquerda">

    <button class="btn-voltar">
        <img src="images/botao_voltar.png" alt="Voltar">
    </button>

</aside>


<!-- ÁREA PRINCIPAL -->
<div class="pagina">

    <!-- CABEÇALHO -->
    <header class="header">

        <!-- LOGO -->
        <div class="logo">
            <img src="images/logo_titulo_horizontal.png" alt="Mãos à Obra">
        </div>


        <!-- AÇÕES DO USUÁRIO -->
        <div class="acoes">

            <a href="formCadastro.html" class="usuario">
                <img src="images/cadastrar.png" alt="">
                <span>Cadastrar</span>
            </a>

            <a href="formLogin.html" class="usuario">
                <img src="images/entrar.png" alt="">
                <span>Entrar</span>
            </a>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">


        <!-- PESQUISA -->
        <section class="pesquisa">

            <button class="btn-filtro">
                <img src="/images/filtro.png" alt="Filtros">
            </button>

            <label for="pesquisa"></label>
            <input id="pesquisa" class="campo-pesquisa" type="text" placeholder="Pesquise aqui...">

            <button class="btn-pesquisar">
                <img src="/images/lupa.png" alt="Pesquisar">
            </button>

        </section>


        <!-- LISTA DE TRABALHADORES -->
        <section class="lista-trabalhadores">

            <!-- CARD DO TRABALHADOR -->
            <article class="card-trabalhador">

                <!-- FOTO -->
                <div class="foto-trabalhador">
                    <img
                            src="/images/foto_perfil.png"
                            alt="Foto do trabalhador"
                    >
                </div>


                <!-- INFORMAÇÕES -->
                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2>*Nome* *Idade*</h2>

                        <p>*Tipo de serviço*</p>
                    </div>


                    <!-- AVALIAÇÃO -->
                    <div class="avaliacao">
                        <span>4,7</span>
                        <span class="estrela">★</span>
                    </div>


                    <!-- BOTÃO -->
                    <a href="perfil.html" class="btn-perfil">
                        VER PERFIL
                    </a>

                </div>

            </article>


            <!-- OUTRO CARD -->
            <article class="card-trabalhador">

                <div class="foto-trabalhador">
                    <img
                            src="/images/foto_perfil.png"
                            alt="Foto do trabalhador"
                    >
                </div>

                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2>*Nome* *Idade*</h2>
                        <p>*Tipo de serviço*</p>
                    </div>

                    <div class="avaliacao">
                        <span>4,7</span>
                        <span class="estrela">★</span>
                    </div>

                    <a href="perfil.html" class="btn-perfil">
                        VER PERFIL
                    </a>

                </div>

            </article>


            <!-- OUTRO CARD -->
            <article class="card-trabalhador">

                <div class="foto-trabalhador">
                    <img
                            src="/images/foto_perfil.png"
                            alt="Foto do trabalhador"
                    >
                </div>

                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2>*Nome* *Idade*</h2>
                        <p>*Tipo de serviço*</p>
                    </div>

                    <div class="avaliacao">
                        <span>4,7</span>
                        <span class="estrela">★</span>
                    </div>

                    <a href="perfil.html" class="btn-perfil">
                        VER PERFIL
                    </a>

                </div>

            </article>

        </section>

    </main>

</div>

<!-- BARRA LATERAL DIREITA -->
<aside class="sidebar-direita">

</aside>

<script>

    async function verificarLogin() {
        const resposta = await fetch("/login/me");

        if (resposta.ok) {

            const usuario = await resposta.json();

            if (usuario.tipo === "TRABALHADOR")
                window.location.href =  "/inicioPrestador";
            else
                window.location.href = "/inicioCliente";
        }
    }

    verificarLogin()

</script>

</body>

</html>
