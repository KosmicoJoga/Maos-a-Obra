<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos à obra</title>
    <link rel="stylesheet" href="css/geral.css">
    <link rel="stylesheet" href="css/stylesenha.css">
    <link rel="icon" type="image/png" href="images/Logo_TCC.png">
</head>
<body>
<aside class="sidebar-esquerda">

    <button class="btn-voltar" onclick="history.back()">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>
<div class="pagina">
    <header class="header">
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="logo">
        </div>
    </header>
    <main class="conteudo">
        <form class="form-logar" id="loginForm" method="post">
            <div class="texto">
                <h1>Mudar senha</h1>
            </div>

            <div class="MudarSenha">
                <div class="SenhaAntiga">
                    <label for="senha">Senha atual:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="senha">
                    <label for="senha">Senha nova:</label>
                    <input type="text" id="senha" name="senha">
                </div>

                <div class="ConfirmaSenha">
                    <label for="senha" id="MudaSenha">Confirmar senha: </label>
                    <input type="text" id="senhaConfirma" name="senha Senha Confirma">

                </div>

                <button class="btn-enviar"  type="submit">
                    Confirmar mudanças
                </button>
            </div>
        </form>
    </main>
</div>

<script>

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;

        const dados = {
            email: email,
            senha: senha,
        };

        try {
            const resposta = await fetch("/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(dados)
            });

            if (resposta.ok) {
                const usuario = await resposta.json();
                window.location.href = usuario.tipo === "TRABALHADOR"
                    ? "inicioPrestador" : "inicioCliente";
            } else
                alert("Email ou senha inválidos!")
        } catch (erro) {
            console.erro("Erro ao tentar logar:", erro);
            alert("Não foi possível conectar ao servidor");
        }

    })

</script>

<aside class="sidebar-direita">

</aside>
</body>
</html>
