<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

    <title>Mãos à obra</title>
    <link rel="stylesheet" href="/css/geral.css">

<div class="pagina">

    <!-- CABEÇALHO -->
    <header class="header">

        <!-- LOGO -->
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="Mãos à Obra">
        </div>


        <!-- AÇÕES DO USUÁRIO -->
        <div class="acoes">

            </a>
            <a class="usuario">
                <img src="/images/foto_perfil.png" alt="Foto do usuário">
                <span th:text="${nome}">Nome</span>
            </a>

            <button class="logout" onclick="logout()">
                <img src="/images/sair.png" alt="Logout" id="logout">
                <img src="/images/sair_hover.png" alt="Logout" id="logout-hover">
            </button>
        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">


        <!-- PESQUISA -->
        <section class="pesquisa">

            <button class="btn-filtro">
                <img src="/images/filtro.png" alt="Filtros">
            </button>

            <input
                    type="text"
                    placeholder="Pesquise aqui..."
                    class="campo-pesquisa"
            >

            <button class="btn-pesquisar">
                <img src="/images/lupa.png" alt="Pesquisar">
            </button>

        </section>

        <div class="linha">
            <span>Soliticações de Demanda</span>
        </div>

    </main>

</div>

<script>
    async function logout() {
        const resposta = await fetch("/login/logout", {method: "POST"});

        if (resposta.ok) {
            window.location.href = "login.html";
        } else {
            alert("Erro ao encerrar a sessão");
        }
    }
</script>
