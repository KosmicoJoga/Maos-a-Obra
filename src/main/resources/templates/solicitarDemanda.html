<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos à obra</title>
    <link rel="stylesheet" href="/css/geral.css">
    <link rel="stylesheet" href="/css/styleSolicitar.css">
    <link rel="icon" type="image/png" href="/images/Logo_TCC.png">
</head>
<body>
<aside class="sidebar-esquerda">

    <button class="btn-voltar" onclick="history.back()">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>
<div class="pagina">
    <header class="header">
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="logo">
        </div>
    </header>
    <main class="conteudo">
        <div class="texto">
            <h1 th:text="'Solicitar serviço a ' + ${trabalhador.nome}">Solicitar serviço</h1>
        </div>

        <form id="formSolicitacao" th:data-trabalhador="${trabalhador.id}">
            <div class="demanda">
                <div class="local">
                    <label for="local">CEP do local:</label>
                    <input type="text" id="local" name="Local" placeholder="Digite o endereço" required>
                </div>
                <div class="descricao">
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="Descricao" placeholder="Descreva o serviço detalhadamente" rows="3" required></textarea>
                </div>
                <div class="orcamento">
                    <label for="orcamento">Orçamento:</label>
                    <input type="number" id="orcamento" name="Orcamento" min="0" step="0.01" placeholder="Digite um orçamento" required>
                </div>

                <button class="btn-solicita" type="submit">Solicitar serviço</button>

            </div>
        </form>
    </main>
</div>

<aside class="sidebar-direita">

</aside>

<script>
    const form = document.getElementById('formSolicitacao');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const dados = {
            idTrabalhador: Number(form.dataset.trabalhador),
            endereco: document.getElementById("local").value,
            descricao: document.getElementById("descricao").value,
            orcamento: Number(document.getElementById("orcamento").value)
        };

        try {
            const resposta = await fetch("/demandas/direta", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(dados),
            });

            if (resposta.ok) {
                alert("Solicitação enviada ao prestador de serviços!");
                window.location.href = "/inicioCliente";
            } else if (resposta.status === 400) {
                const erro = await resposta.json();
                alert(erro.erro);
            } else
                alert("Não foi possível enviar a solicitação!")
        } catch (e) {
            alert("Não foi possível conectar ao servidor!");
        }
    });
</script>

</body>

</html>
