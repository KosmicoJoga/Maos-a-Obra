<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos à obra</title>
    <link rel="stylesheet" href="/css/geral.css">
    <link rel="stylesheet" href="/css/styleinicioCliente.css?v=10">
    <link rel="icon" type="image/png" href="/images/Logo_TCC.png">
</head>
<body>


<!-- BARRA LATERAL ESQUERDA-->
<aside class="sidebar-esquerda">

    <button class="btn-voltar">
        <img src="/images/Botao_voltar.png" alt="Voltar" onclick="history.back()">
    </button>

</aside>


<!-- ÁREA PRINCIPAL -->
<div class="pagina">

    <!-- CABEÇALHO -->
    <header class="header">

        <!-- LOGO -->
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="Mãos à Obra">
        </div>


        <!-- AÇÕES DO USUÁRIO -->
        <div class="acoes">

            <a class="notificações" onclick=CarregarNotificacoes()>
                <img src="/images/notificacoes.png" alt="Notificações">
            </a>
            <a class="mensagens" onclick="CarregarMensagens()">
                <img src="/images/mensagens.png" alt="Mensagens">
            </a>
            <a class="usuario" href="/perfil/logado">
                <img src="/images/foto_perfil.png" alt="Foto do usuário">
                <span th:text="${nome}">Nome</span>
            </a>

            <button class="logout" onclick="logout()">
                <img src="/images/sair.png" alt="Logout" id="logout">
                <img src="/images/sair_hover.png" alt="Logout" id="logout-hover">
            </button>

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">


        <!-- PESQUISA -->
        <section class="pesquisa">

            <button class="btn-filtro">
                <img src="/images/filtro.png" alt="Filtros">
            </button>

            <label for="pesquisa"></label>
            <input id="pesquisa" class="campo-pesquisa" type="text" placeholder="Pesquise aqui...">

            <button class="btn-pesquisar">
                <img src="/images/lupa.png" alt="Pesquisar">
            </button>

        </section>

        <!-- BOTÃO PARA ANUNCIAR UMA DEMANDA PÚBLICA -->
        <a href="/demanda.html" class="btn-demanda">
            ANUNCIAR DEMANDA
        </a>

        <div class="linha">

            <span>Trabalhadores recomendados</span>

        </div>

        <!-- LISTA DE TRABALHADORES -->
        <section class="lista-trabalhadores">

            <!-- CARD DO TRABALHADOR -->
            <article class="card-trabalhador" th:each="t : ${trabalhadores}">

                <div class="foto-trabalhador">
                    <img src="/images/foto_perfil.png" alt="Foto do Trabalhador">
                </div>

                <div class="informacoes-trabalhador">

                    <div class="dados-trabalhador">
                        <h2 th:text="${t.nome} + ', ' + ${t.idade}">Nome, idade</h2>
                        <p th:text="${t.servico?.tipo} ?: 'Serviço não informado'">Tipo de serviço</p>
                    </div>

                    <div class="avaliacao">
                        <th:block th:if="${t.avaliacao != null}">
                            <span th:text="${#numbers.formatDecimal(t.avaliacao, 1, 1, 'COMMA')}">4,7</span>
                            <span class="estrela">★</span>
                        </th:block>
                        <span th:if="${t.avaliacao == null}">Sem avaliações</span>
                    </div>

                    <a href="/perfil.html" class="btn-perfil">VER PERFIL</a>

                </div>

            </article>

            <p th:if="${#lists.isEmpty(trabalhadores)}">Nenhum trabalhador cadastrado ainda.</p>

        </section>

    </main>

</div>

<!-- BARRA LATERAL DIREITA -->
<aside class="sidebar-notifica" id="mostraNotificacao" style="display: none">
    <img src="/images/Botao_voltar.png" id="btn-voltarSideBar" onclick=SideBar()>
    <span> Notificações</span>
</aside>

<aside class="sidebar-direita" id="sidebar">

</aside>

<aside class="sidebar-mensagen" id="mostraMensagen" style="display: none">
    <img src="/images/Botao_voltar.png" id="btn-voltarSideBarmsg" onclick=SideBar()>
    <span> Mensagens</span>
</aside>
</body>

<script>
    const notificacoes = document.getElementById("mostraNotificacao");
    const sideBar = document.getElementById("sidebar");
    const mensagen = document.getElementById("mostraMensagen");

    async function CarregarNotificacoes() {
        notificacoes.style.display = "flex";
        sideBar.style.display = "none";
        mensagen.style.display = "none";
    }

    async function SideBar() {
        notificacoes.style.display = "none";
        sideBar.style.display = "flex";
        mensagen.style.display = "none";
    }

    async function CarregarMensagens() {

        notificacoes.style.display = "none";
        sideBar.style.display = "none";
        mensagen.style.display = "flex";
    }
</script>

<script>
    async function logout() {
        const resposta = await fetch("/login/logout", {method: "POST"});

        if (resposta.ok) {
            window.location.href = "/login.html";
        } else {
            alert("Erro ao encerrar a sessão");
        }
    }
</script>
</html>
