<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mãos à obra</title>
    <link rel="stylesheet" href="/css/geral.css">
    <link rel="stylesheet" href="/css/styleinicioPrestador.css">
    <link rel="icon" type="image/png" href="/images/Logo_TCC.png">
</head>
<body>


<!-- BARRA LATERAL ESQUERDA-->
<aside class="sidebar-esquerda">

    <button class="btn-voltar">
        <img src="/images/Botao_voltar.png" alt="Voltar">
    </button>

</aside>


<!-- ÁREA PRINCIPAL -->
<div class="pagina">

    <!-- CABEÇALHO -->
    <header class="header">

        <!-- LOGO -->
        <div class="logo">
            <img src="/images/Logo_titulo_horizontal.png" alt="Mãos à Obra">
        </div>


        <!-- AÇÕES DO USUÁRIO -->
        <div class="acoes">

            <a class="notificações">
                <img src="/images/notificacoes.png" alt="Notificações">
            </a>
            <a class="mensagens">
                <img src="/images/mensagens.png" alt="Mensagens">
            </a>
            <a class="usuario" href="/perfil/logado">
                <img src="/images/foto_perfil.png" alt="Foto do usuário">
                <span th:text="${nome}">Nome</span>
            </a>

            <button class="logout" onclick="logout()">
                <img src="/images/sair.png" alt="Logout" id="logout">
                <img src="/images/sair_hover.png" alt="Logout" id="logout-hover">
            </button>
        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">


        <!-- PESQUISA -->
        <section class="pesquisa">

            <button class="btn-filtro">
                <img src="/images/filtro.png" alt="Filtros">
            </button>

            <label for="pesquisa"></label>
            <input id="pesquisa" class="campo-pesquisa" type="text" placeholder="Pesquise aqui...">

            <button class="btn-pesquisar">
                <img src="/images/lupa.png" alt="Pesquisar">
            </button>

        </section>

        <a href="/solicitacoesDemanda" class="btn-solicitacoes">
            VER SOLICITAÇÕES DE CLIENTES
        </a>

        <div class="linha">

            <span>Demandas públicas</span>

        </div>

        <!-- LISTA DE DEMANDAS -->
        <section class="lista-demandas">

            <!-- CARD DA DEMANDA -->
            <article class="card-demanda" th:each="d : ${demandas}" th:data-lat="${d.obra.latitude}" th:data-lng="${d.obra.longitude}">

                <!-- FOTO DO CLIENTE -->
                <div class="foto-cliente">
                    <img src="/images/foto_perfil.png" alt="Foto do Cliente">
                </div>

                <!-- INFORMAÇÕES DA DEMANDA -->
                <div class="informacoes-demanda">

                    <div class="dados-demanda">
                        <h2 th:text="'TIPO DE SERVIÇO: ' + ${d.obra.servico.tipo}">Tipo de serviço</h2>
                        <p th:text="'NOME E LOCAL: ' + ${d.cliente.nome} + ' • ' + ${d.obra.endereco}">Cliente • Local</p>
                        <p th:text="'DESCRIÇÃO: ' + ${d.obra.descricao}">Descrição</p>
                        <p class="distancia"></p>
                    </div>

                    <div class="orcamento">
                        <span th:text="'ORÇAMENTO: R$ ' + ${#numbers.formatDecimal(d.obra.orcamento, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</span>
                    </div>

                    <a class="btn-demanda" href="#">VER DEMANDA</a>
                </div>
            </article>

            <p th:if="${#lists.isEmpty(demandas)}">Nenhuma solicitação de demanda no momento.</p>

        </section>

    </main>

</div>

<script>
    async function logout() {
        const resposta = await fetch("/login/logout", {method: "POST"});

        if (resposta.ok) {
            window.location.href = "/login.html";
        } else {
            alert("Erro ao encerrar a sessão");
        }
    }

    function haversinekm(lat1, lon1, lat2, lon2) {
        const R = 6371; // raio da Terra em km
        const toRad = g => g * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);

        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;

        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function mostrarDistancias() {
        if (!navigator.geolocation) return;

        navigator.geolocation.getCurrentPosition(pos => {
            const minhaLat = pos.coords.latitude;
            const minhaLon = pos.coords.longitude;

            document.querySelectorAll(".card-demanda").forEach(card => {
                if (!card.dataset.lat || !card.dataset.lng) return; // demanda sem coordenada

                const km = haversinekm(minhaLat, minhaLon, Number(card.dataset.lat), Number(card.dataset.lng));

                card.querySelector(".distancia").textContent = "Aproximadamente " + km.toFixed(1).replace(".", ",") + " km de você";
            });
        });
    }

    mostrarDistancias();
</script>

<!-- BARRA LATERAL DIREITA -->
<aside class="sidebar-direita">

</aside>
</body>

</html>
